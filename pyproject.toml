[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synccut"
version = "2.0.0"
description = "Global Multi-Source Audio-Visual Synchronization & Rough Cut Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SyncCut Team"}
]
dependencies = [
    "numpy<2.3",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "flask",
    "flask-cors",
    "opentimelineio",
    "platformdirs",
    "celery[redis]>=5.5",
    "onnxruntime",
    "opencv-python-headless",
    "librosa",
    "reportlab",
    "gunicorn",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "stripe>=10.0,<17.0",
]

[project.scripts]
synccut = "synccut.cli.main:main"
synccut-gui = "synccut.desktop.gui:main"

[tool.setuptools.packages.find]
include = ["synccut*"]

[tool.setuptools.package-data]
synccut = ["api/templates/*", "api/static/**/*", "media/ffmpeg_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
