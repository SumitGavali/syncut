# Production-oriented stack scaffold (API + Redis + Celery worker).
# Usage from repo root:
#   docker compose -f infra/docker-compose.yml up --build
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SYNCCUT_DATA_DIR=/var/lib/synccut
    volumes:
      - synccut_data:/var/lib/synccut
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: celery -A synccut.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SYNCCUT_DATA_DIR=/var/lib/synccut
    volumes:
      - synccut_data:/var/lib/synccut
    depends_on:
      - redis
      - api

volumes:
  synccut_data:
