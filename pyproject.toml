[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synccut"
version = "2.0.0"
description = "Global Multi-Source Audio-Visual Synchronization & Rough Cut Suite"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "SyncCut Team"}
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "flask",
    "flask-cors",
    "opentimelineio",
    "platformdirs",
    "gunicorn",
]

[project.scripts]
synccut = "synccut.cli.main:main"
synccut-gui = "synccut.desktop.gui:main"

[tool.setuptools.packages.find]
include = ["synccut*"]

[tool.setuptools.package-data]
synccut = ["api/templates/*", "api/static/**/*", "media/ffmpeg_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
